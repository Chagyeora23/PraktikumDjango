{% extends 'mahasiswadinda/base.html' %}
{% load static %}

{% block content %}
<h2>Tambah Mahasiswa</h2>

<form method="post">
    {% csrf_token %}
    NIM: <input type="text" name="nim" required><br><br>
    Nama: <input type="text" name="nama" required><br><br>
    Program Studi: <input type="text" name="programstudi" required><br><br>
    
    <button type="submit" class="btn">Simpan</button>
    <a href="{% url 'daftar' %}" class="btn btn-secondary">Kembali</a>
</form>
{% endblock %}
